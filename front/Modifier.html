<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modifier Recette</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(-45deg, #e0f7fa, #e1bee7, #fce4ec, #b3e5fc);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-gray-800">
  <div class="max-w-4xl w-full bg-white bg-opacity-90 rounded-lg shadow-xl p-8">
    <h1 class="text-3xl font-bold mb-6 text-center text-blue-700">Modifier la Recette</h1>

    <label for="original-title" class="block font-semibold mb-1">Nom de la recette (FR):</label>
    <input type="text" id="original-title" class="w-full p-2 border border-gray-300 rounded mb-4" />

    <label for="image-url-input" class="block font-semibold mb-1">URL de l'image :</label>
    <input type="text" id="image-url-input" class="w-full p-2 border border-gray-300 rounded mb-4" />

    <div class="mb-6">
      <label class="block font-semibold mb-2">Ingrédients :</label>
      <div id="original-ingredients" class="space-y-2"></div>
      <button onclick="addItem('ingredient')" class="mt-2 px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">Ajouter un ingrédient</button>
    </div>

    <div class="mb-6">
      <label class="block font-semibold mb-2">Étapes :</label>
      <div id="steps-section" class="space-y-2"></div>
      <button onclick="addItem('step')" class="mt-2 px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">Ajouter une étape</button>
    </div>

    <div class="mb-6">
      <label class="block font-semibold mb-2">Restrictions :</label>
      <div id="restrictions-section" class="space-y-2"></div>
      <button onclick="addItem('restriction')" class="mt-2 px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">Ajouter une restriction</button>
    </div>

    <button onclick="saveRecipeModifications()" class="w-full py-3 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition">Enregistrer</button>
  </div>

<script src="modifier.js"></script>
</body>
</html>
