<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Détail de la Recette</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

  <div class="max-w-3xl mx-auto px-6 py-10">

    <!-- Image et titre de la recette -->
    <div class="text-center mb-6">
      <img id="recette-img" src="" alt="Image de la recette" class="w-full max-w-xl mx-auto rounded-lg shadow-md object-cover h-48" />
      <h1 id="recette-title" class="text-3xl font-extrabold text-gray-800 mt-4">Chargement...</h1>
      <p class="text-lg text-gray-600 italic">Recette par ...</p>
    </div>

    <!-- Restrictions alimentaires -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-3">Restrictions Alimentaires</h2>
      <ul id="restrictions" class="list-disc pl-6 text-gray-700"></ul>
    </div>

    <!-- Liste des ingrédients -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-3">Ingrédients</h2>
      <ul id="recette-ingredients" class="list-disc pl-6 text-gray-700"></ul>
    </div>

    <!-- Étapes de la recette -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-3">Étapes</h2>
      <ul id="recette-steps" class="list-decimal pl-6 space-y-2 text-gray-700"></ul>
    </div>

    <!-- Bouton J'aime -->
    <div class="text-center mb-6">
      <button id="like-button" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-lg shadow-md transition">
        J'aime
      </button>
      <p id="like-count" class="mt-2 text-gray-600">        </p>

    </div>

    <!-- Bouton Traduction -->
<!--     <div class="text-center mb-6">
      <a href="traduction.html?id=${recipe.id}">
      <button id="getraduction-button" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-lg shadow-md transition">
        Traduire/Translate
      </button>
      </a>
    </div> -->

    <!-- Section des commentaires -->
    <div class="comments-section">
      <h2 class="text-xl font-semibold text-gray-800 mb-3">Commentaires</h2>

      <!-- Liste des commentaires -->
      <ul id="commentaires" class="mt-6 space-y-4"></ul>

      <!-- Ajouter un commentaire -->
      <textarea name="message" id="comment-input" class="w-full p-3 mt-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 mb-4" placeholder="Ajouter un commentaire"></textarea>
      <input type="file" id="comment-image" accept="image/*" class="mt-2" /> <br><br>
      <button id="comment-button" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-lg shadow-md transition">
        Envoyer
      </button>
    </div>
  </div>

  <script src="recette.js"></script>

  <footer class="bg-gray-800 text-white py-6">
    <div class="container mx-auto text-center">
      <p>&copy; 2025 Glodon. Tous droits réservés.</p>
      <p>Développé avec ❤️ par Soso & Kev</p>
    </div>
  </footer>
</body>
</html>
