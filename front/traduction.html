<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Édition & Traduction de Recette</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans py-10 px-6 relative">

  <!-- Fond visuel flou et circulaire -->
  <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-[#ffbbd6] blur-2xl opacity-40 rounded-full -z-10"></div>
  <div class="absolute top-1/4 left-1/2 w-[600px] h-[600px] bg-[#eaf4d3] blur-2xl opacity-30 rounded-[40%] -z-10"></div>
  <div class="absolute top-1/2 left-1/4 w-[400px] h-[400px] bg-gradient-to-r from-[#ff9f00] to-[#ff5349] blur-lg opacity-40 rounded-[60%] -z-10"></div>

  <!-- Formes animées -->
  <div class="absolute top-16 right-10 w-72 h-72 bg-gradient-to-l from-[#ffe8c8] to-[#ff9f00] blur-xl opacity-40 rounded-full -z-10 animate-pulse"></div>
  <div class="absolute bottom-32 left-16 w-56 h-56 bg-[#eaf4d3] blur-md opacity-50 rounded-[60%] -z-10 animate-pulse"></div>

  <!-- Contenu principal -->
  <div class="max-w-7xl mx-auto space-y-10">

    <!-- Image et titre -->
    <div class="text-center">
      <img id="recipe-image" src="" alt="Image de la recette" class="w-full max-w-xl mx-auto rounded-lg shadow-md" />
      <h1 id="recipe-title" class="text-3xl font-bold mt-4">Modifier & Traduire la Recette</h1>
    </div>

    <!-- Formulaire de modification -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="font-semibold">Titre (original)</label>
        <input type="text" id="original-title" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="font-semibold">Titre (traduction)</label>
        <input type="text" id="translated-title" class="w-full border rounded px-3 py-2" />
        <p id="translated-title-error" class="text-red-500 text-sm hidden">Le titre traduit est requis</p>
      </div>
    </div>

    <!-- Ingrédients -->
    <div class="space-y-6" id="ingredients-section">
      <h2 class="text-xl font-semibold mb-2">Ingrédients</h2>

      <!-- Grille miroir -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Section ingrédients traduits (gauche) -->
        <div>
          <h3 class="font-medium mb-2">Ingrédients (traduction)</h3>
          <div id="translated-ingredients" class="space-y-4">
            <!-- Les ingrédients traduits seront insérés ici dynamiquement -->
          </div>
        </div>

        <!-- Section ingrédients originaux (droite) -->
        <div>
          <h3 class="font-medium mb-2">Ingrédients (original)</h3>
          <div id="original-ingredients" class="space-y-4">
            <!-- Les ingrédients originaux seront insérés ici dynamiquement -->
          </div>
        </div>
      </div>
    </div>

    <!-- Étapes & Durée -->
    <div id="steps-section">
      <h2 class="text-xl font-semibold mb-4">Étapes & Durée</h2>
      <!-- Les étapes seront insérées ici dynamiquement -->
    </div>




<div class="space-y-6">
  <h2 class="text-xl font-semibold mb-2">Restrictions</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Traduction -->
    <div>
      <h3 class="font-medium mb-2">Restrictions (traduction)</h3>
      <div id="without-en" class="space-y-2"></div>
    </div>
    <!-- Original -->
    <div>
      <h3 class="font-medium mb-2">Restrictions (original)</h3>
      <div id="without-fr" class="space-y-2"></div>
    </div>
  </div>
</div>



    <!-- Boutons de sauvegarde et annulation -->
    <div class="text-center mt-10 space-x-4">
      <button id="save-button" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded">Sauvegarder</button>
      <button onclick="cancel()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-2 rounded">Annuler</button>
    </div>

  </div>

  <script src="traduction.js"></script>
</body>
</html>
